# democracia-social — Sovereign Participatory Democracy Platform (codename PINDORAMA)
# Cargo workspace. The crate boundary is the agent boundary (PLAN.md section 6).
[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/api-contract",
    "crates/app",
    "crates/gateway",
    "crates/platform/*",
    "crates/spaces/*",
    "crates/components/*",
    "crates/clients/*",
    "tests/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["PopSolutions Cooperativa de Tecnologia"]
repository = "https://git.pop.coop/brasil/democracia-social"
rust-version = "1.86"

[workspace.dependencies]
# --- async runtime / web ---
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "timeout", "fs"] }
# --- database: explicit, compile-time-checked SQL only (PLAN.md principle 3) ---
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate", "json"] }
pgvector = { version = "0.4", features = ["sqlx"] }
redis = { version = "0.27", features = ["tokio-comp"] }
# --- serialization / contracts ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
# --- identity / http clients ---
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
# --- web push (RFC 8291) — mobile-first participation (PLAN.md princípio 9) ---
web-push = { version = "0.10", default-features = false, features = ["hyper-client"] }
base64 = "0.22"
# --- RSA + HTTP Signatures for ActivityPub federation (ADR-0010 W2) ---
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"
# --- local embedding inference (consensus `model-embedder` feature; PLAN.md principle 11:
# sovereign models only — pure-Rust CPU inference, no external service, no C runtime) ---
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.23"
# --- object storage (S3-compatible; MinIO is the sovereign default per ADR-0010) ---
# `default-https-client` (hyper 1 + rustls 0.23) replaces the deprecated `rustls`
# feature, whose legacy hyper 0.14 chain pinned rustls-webpki 0.101 (3 RUSTSEC
# advisories: 2026-0098/0099/0104 — cert name-constraint bypass + CRL panic).
aws-config = { version = "1.8", default-features = false, features = ["default-https-client", "behavior-version-latest", "rt-tokio"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "behavior-version-latest", "rt-tokio"] }
aws-credential-types = "1"
# --- ids / time / errors / logging ---
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
async-trait = "0.1"
argon2 = "0.5"
anyhow = "1"
tracing = "0.1"
# --- image processing (avatar/cover resize, ADR-0010 W1.2) ---
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# OG cards (0.33.0): rasterização de texto pro PNG do placar — pure Rust.
ab_glyph = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
# Auditability: forbid panics on the request hot path (PLAN.md principle 3).
unwrap_used = "warn"
expect_used = "warn"
