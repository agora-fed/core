# Live production deployment on the sovereign VM (k3s). The STATEFUL tier (PostgreSQL 17 + pgvector)
# runs on the VM host (apt), consumed externally — aligned with ADR-0002. The gateway pod uses
# hostNetwork so it reaches Postgres on [::1] and binds the host's public IPv6 directly (no Ingress
# needed on this single-node, IPv6-first node). See docs/ops/DEPLOYMENT-k3s-vm.md.
#
# ⚠ SECRETS LIVE OUTSIDE THIS FILE. This manifest is safe to `kubectl apply`
# on the live cluster. The `dsoc-gateway-secrets` Secret is bootstrapped ONCE
# from deploy/k8s/gateway-secrets.example.yaml (placeholders) and thereafter
# managed ONLY via `kubectl patch secret` — on 2026-07-10 an apply of this
# file (when the Secret still lived here) overwrote the production
# credentials with CHANGE_ME placeholders and took the site down.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dsoc-gateway, labels: { app: dsoc-gateway } }
spec:
  replicas: 1
  strategy: { type: Recreate }   # hostNetwork: only one pod can own host:8080
  selector: { matchLabels: { app: dsoc-gateway } }
  template:
    metadata: { labels: { app: dsoc-gateway } }
    spec:
      hostNetwork: true
      # `Default` makes the pod use the HOST's `/etc/resolv.conf`. `ClusterFirstWithHostNet`
      # routes DNS at the in-cluster CoreDNS (`10.43.0.10`), which a hostNetwork pod cannot
      # actually reach — the result was every external lookup failing (mastodon.social etc.).
      # With `Default`, IPv6 resolution works through whichever resolver the VM is configured to
      # use (the sovereign one), and we still need no cluster-internal service discovery anyway.
      dnsPolicy: Default
      containers:
      - name: gateway
        image: docker.io/library/dsoc-gateway:0.71.0
        imagePullPolicy: Never        # image imported into containerd (k8s.io ns) on this node
        envFrom: [ { secretRef: { name: dsoc-gateway-secrets } } ]
        env:
        - { name: GATEWAY_PORT, value: "8080" }
        - { name: RUST_LOG, value: "info" }
        # Real semantic clustering (0.27.0): multilingual-e5-small served from a
        # hostPath volume (artifacts scp'd to /opt/dsoc/model on the VM — the VM
        # has IPv6-only egress and cannot pull from HF). Unset CONSENSUS_EMBEDDER
        # (or set to `stub`) to fall back to deterministic feature hashing.
        - { name: CONSENSUS_EMBEDDER, value: "model" }
        - { name: CONSENSUS_MODEL_DIR, value: "/srv/model" }
        - { name: CONSENSUS_QUERY_PREFIX, value: "query: " }   # E5-family requirement
        # NLI pair judge (0.28.0): reads merge candidates jointly — homonyms
        # and antagonists never share a cluster. mDeBERTa-xnli artifacts.
        - { name: CONSENSUS_NLI_DIR, value: "/srv/model-nli" }
        ports: [ { containerPort: 8080 } ]
        # Boot frio carrega e5-small + mDeBERTa do hostPath ANTES do listener
        # (~85 s medidos em 2026-07-10, quando a liveness matou o pod no meio
        # do boot). O startupProbe dá até 5 min pra subir; liveness/readiness
        # só valem depois que ele passa.
        startupProbe:   { httpGet: { path: /health, port: 8080 }, periodSeconds: 5, failureThreshold: 60 }
        readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 3, periodSeconds: 10 }
        livenessProbe:  { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 20 }
        # Memory: e5-small ~450 MB + mDeBERTa-xnli ~1.1 GB (f16 on disk, f32 in
        # RAM) + inference peaks; 3 Gi keeps margin without starving Postgres
        # on the 8 GB host.
        resources: { requests: { cpu: "50m", memory: "1Gi" }, limits: { memory: "3Gi" } }
        volumeMounts:
        - { name: consensus-model, mountPath: /srv/model, readOnly: true }
        - { name: consensus-nli, mountPath: /srv/model-nli, readOnly: true }
      volumes:
      - name: consensus-model
        hostPath: { path: /opt/dsoc/model, type: DirectoryOrCreate }
      - name: consensus-nli
        hostPath: { path: /opt/dsoc/model-nli, type: DirectoryOrCreate }
