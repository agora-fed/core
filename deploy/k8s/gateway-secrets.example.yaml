# ⚠ BOOTSTRAP ONLY — NUNCA aplicar num cluster que já tem o Secret real.
# `kubectl apply` faz merge das chaves listadas aqui e SOBRESCREVE os valores
# de produção com os placeholders (aconteceu em 2026-07-10: site fora do ar
# até restaurar DATABASE_URL/SMTP_* na mão). Depois do bootstrap, todo update
# é via patch:
#   sudo k3s kubectl patch secret dsoc-gateway-secrets --type=merge \
#     -p '{"stringData":{"CHAVE":"valor"}}'
# Runbook: docs/ops/DEPLOYMENT-k3s-vm.md.
apiVersion: v1
kind: Secret
metadata: { name: dsoc-gateway-secrets, namespace: default }
type: Opaque
stringData:
  # Postgres local via loopback IPv6; sslmode=disable (mesmo host, sem TLS).
  DATABASE_URL: "postgres://dsoc:CHANGE_ME@[::1]:5432/democracia_social?sslmode=disable"
  # Relay SMTP soberano (password-reset, convites, SLA, formulário /contato).
  SMTP_HOST: "CHANGE_ME"
  SMTP_PORT: "587"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  SMTP_FROM: "DemocraciaBR <sistema@democracia.social.br>"
