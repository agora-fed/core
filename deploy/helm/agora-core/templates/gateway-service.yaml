{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agora.fullname" . }}
  labels: {{- include "agora.labels" . | nindent 4 }}
spec:
  # IPv6-first.
  ipFamilyPolicy: {{ .Values.network.ipFamilyPolicy }}
  ipFamilies:
    - {{ .Values.network.ipFamily }}
  selector: {{- include "agora.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
