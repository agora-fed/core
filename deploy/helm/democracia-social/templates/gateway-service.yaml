{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ds.fullname" . }}
  labels: {{- include "ds.labels" . | nindent 4 }}
spec:
  # IPv6-first (PLAN.md principle 4).
  ipFamilyPolicy: {{ .Values.network.ipFamilyPolicy }}
  ipFamilies:
    - {{ .Values.network.ipFamily }}
  selector:
    app.kubernetes.io/name: democracia-social
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
