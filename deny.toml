# cargo-deny: supply-chain audit gate (run in CI, see .forgejo/workflows/security.yml).
[advisories]
yanked = "deny"
[bans]
multiple-versions = "warn"
[licenses]
# AGPL project: permit permissive deps; deny copyleft-incompatible / unknown.
allow = ["AGPL-3.0", "Apache-2.0", "MIT", "BSD-3-Clause", "BSD-2-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0"]
confidence-threshold = 0.9
[sources]
unknown-registry = "deny"
unknown-git = "deny"
