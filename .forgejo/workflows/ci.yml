# CI — the primary reliability & audit gate (docs/CICD.md).
# Runs on a self-hosted Forgejo runner in the sovereign park.
name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: rustfmt
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check

  clippy:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: clippy (deny warnings)
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings

  boundaries:
    runs-on: docker
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: crate-boundary + schema guards
        run: |
          ./scripts/check-crate-boundaries.sh
          ./scripts/check-migration-numbers.sh
          ./scripts/check-fk-targets.sh
          ./scripts/check-lints-optin.sh

  test:
    runs-on: docker
    # Host-backend runner: use the real host PostgreSQL (ADR-0002 spirit: real Postgres, not
    # throwaway containers). The IPv6-first runtime is unchanged; CI tooling uses loopback.
    env:
      DATABASE_URL: postgres://dsoc:dsoc@127.0.0.1:5432/democracia_social_ci
      SQLX_OFFLINE: "true"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: migrate + workspace tests (real PostgreSQL)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v sqlx >/dev/null || cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          cargo sqlx migrate run --source migrations
          cargo test --workspace --all-features

  coverage:
    runs-on: docker
    env:
      DATABASE_URL: postgres://dsoc:dsoc@127.0.0.1:5432/democracia_social_ci
      SQLX_OFFLINE: "true"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      # RATCHET, not aspiration: the number below is the measured floor and may
      # only go UP (2026-07-09 baseline: 40.62%; 2026-07-10: 54.16% measured,
      # floor set at 53 for runner variance; target: 95% — tracked in issue #8).
      # Raise it in the same PR that adds coverage; lowering it is a regression
      # and needs an ADR-grade justification.
      - name: coverage gate (ratchet)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked
          command -v sqlx >/dev/null || cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          cargo sqlx migrate run --source migrations
          cargo llvm-cov --workspace --all-features --fail-under-lines 53
