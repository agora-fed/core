[package]
name = "dsoc-federation"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Federation hub & SDK (Phase 3): lets a municipality run a local instance that federates its signal into the central platform."

[lints]
workspace = true

[dependencies]
# Tier-3 rule (PLAN.md §6.1 / ADR-0005): depend ONLY on the frozen public contract,
# never on core/db/app server implementations. This keeps the federation surface a
# pure client of the published shapes, buildable against mocks.
dsoc-api-contract = { path = "../../api-contract" }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
utoipa = { workspace = true }
