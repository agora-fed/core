[package]
name = "dsoc-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Axum router assembling every crate behind one public, IPv6-first API surface."

[lints]
workspace = true

[[bin]]
name = "dsoc-gateway"
path = "src/main.rs"

[dependencies]
dsoc-core = { path = "../core" }
dsoc-db = { path = "../db" }
dsoc-app = { path = "../app" }
dsoc-api-contract = { path = "../api-contract" }
# platform
dsoc-auth = { path = "../platform/auth" }
dsoc-notify = { path = "../platform/notify" }
dsoc-events = { path = "../platform/events" }
# `model-embedder`: the production binary ships with real local semantics
# compiled in; runtime activation stays behind CONSENSUS_EMBEDDER=model.
dsoc-consensus = { path = "../platform/consensus", features = ["model-embedder"] }
dsoc-moderation = { path = "../platform/moderation" }
dsoc-admin = { path = "../platform/admin" }
dsoc-storage = { path = "../platform/storage" }
# l10n_br (ADR-0015): Título de Eleitor + IBGE atrás das abstrações do core.
dsoc-l10n-br = { path = "../platform/l10n-br" }
# clients
dsoc-federation = { path = "../clients/federation" }
# spaces
dsoc-processes = { path = "../spaces/processes" }
dsoc-assemblies = { path = "../spaces/assemblies" }
dsoc-initiatives = { path = "../spaces/initiatives" }
dsoc-consultations = { path = "../spaces/consultations" }
dsoc-mandates = { path = "../spaces/mandates" }
# components
dsoc-proposals = { path = "../components/proposals" }
dsoc-votes = { path = "../components/votes" }
dsoc-comments = { path = "../components/comments" }
dsoc-forums = { path = "../components/forums" }
dsoc-meetings = { path = "../components/meetings" }
dsoc-budgets = { path = "../components/budgets" }
dsoc-surveys = { path = "../components/surveys" }
dsoc-accountability = { path = "../components/accountability" }
dsoc-consequence = { path = "../components/consequence" }
dsoc-scorecard = { path = "../components/scorecard" }

axum = { workspace = true }
async-trait = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
web-push = { workspace = true }
lettre = { workspace = true }
chrono = { workspace = true }
sqlx = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
image = { workspace = true }
ab_glyph = { workspace = true }
rand = "0.8"
serde_urlencoded = "0.7"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
