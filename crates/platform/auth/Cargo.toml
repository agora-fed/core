[package]
name = "dsoc-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sovereign identity and verification via Zitadel OIDC, with graded verification levels."

[lints]
workspace = true

[dependencies]
dsoc-core = { path = "../../core" }
dsoc-db = { path = "../../db" }
dsoc-api-contract = { path = "../../api-contract" }
dsoc-app = { path = "../../app" }
# l10n_br (ADR-0015): CPF + SaaS cpf-verify vivem atrás da fronteira de localização.
dsoc-l10n-br = { path = "../l10n-br" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
utoipa = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
reqwest = { workspace = true }
lettre = { workspace = true }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
image = { workspace = true }
dsoc-federation = { path = "../../clients/federation" }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
