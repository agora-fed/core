[package]
name = "dsoc-consensus"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Semantic clustering & dedupe via pgvector."

[lints]
workspace = true

[features]
# Real semantic embeddings via a local BERT-family model (candle, pure Rust, CPU).
# Off by default so light dev builds skip the ML dependency tree; the gateway
# release build enables it. Runtime selection stays behind CONSENSUS_EMBEDDER.
model-embedder = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
dsoc-core = { path = "../../core" }
dsoc-db = { path = "../../db" }
dsoc-api-contract = { path = "../../api-contract" }
dsoc-app = { path = "../../app" }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
pgvector = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
