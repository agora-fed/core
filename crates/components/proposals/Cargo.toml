[package]
name = "dsoc-proposals"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Proposals: the primary civic artifact citizens create, directed at a mandate or campaign."

[dependencies]
