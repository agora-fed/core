[package]
name = "dsoc-db"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tier-0 database layer: sqlx pool setup, migration runner, and query conventions. Explicit SQL only (no ORM)."

[lints]
workspace = true

[dependencies]
# Blind index over identifiers (issue #15): HMAC so a dump without the key cannot
# rebuild the column by enumeration.
hmac = "0.12"
sha2 = "0.10"
dsoc-core = { path = "../core" }
sqlx = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
chrono = { workspace = true }
serde_json = { workspace = true }
dsoc-core = { path = "../core" }

