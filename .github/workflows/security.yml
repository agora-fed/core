# Security — supply-chain audit & secret scan (SECURITY.md; PLAN.md principles 8, 11).
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly Monday sweep

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the FULL history, not just HEAD
      - name: tracked-file secret scan
        run: ./scripts/scan-secrets.sh
      - name: gitleaks (full history, CLI — the action requires a license for orgs)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo-deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
